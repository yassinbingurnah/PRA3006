<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About</title>

<style>
  :root {
    --bg: #1c1b1a;
    --bg-gradient: radial-gradient(circle at 20% 10%, #2a2826 0%, #1c1b1a 55%, #141312 100%);
    --text: #ece9e4;
    --accent-1: #d6d3d1;
    --accent-2: #a8a29e;
    --accent-3: #d9b98c;
    --font: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font);
    color: var(--text);
    background: var(--bg);
    background-image: var(--bg-gradient);
    background-attachment: fixed;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 16px 64px;
    line-height: 1.5;
  }

  .container {
    width: 100%;
    max-width: 1100px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
  }

  h1 {
    font-size: clamp(2rem, 5vw, 3.4rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    text-align: center;
    background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .button-row { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }

  .btn {
    display: inline-block;
    min-width: 220px;
    padding: 14px 28px;
    border: none;
    border-radius: 999px;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    text-align: center;
    text-decoration: none;
    color: #fff;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
  }

  .btn-primary { background: var(--accent-1); color: #1c1b1a; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35); }
  .btn-secondary { background: transparent; color: var(--text); border: 1.5px solid var(--accent-2); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25); }
  .btn-secondary:hover { background: rgba(255, 255, 255, 0.06); }
  .btn:hover { transform: translateY(-3px); filter: brightness(1.1); }
  .btn:active { transform: translateY(0); }
  .btn:focus-visible { outline: 3px solid var(--accent-3); outline-offset: 3px; }

  .btn[aria-disabled="true"] { opacity: 0.4; cursor: default; pointer-events: none; box-shadow: none; }

  @media (max-width: 600px) {
    body { padding: 32px 16px 48px; }
    .btn { width: 100%; min-width: 0; }
  }
</style>
</head>
<body>

<div class="container">
  <h1>About</h1>
  <nav class="button-row">
    <a class="btn btn-primary" href="Code.HTML">Network</a>
    <a class="btn btn-secondary" href="issues.html">Collagen healing</a>
    <a class="btn btn-secondary" href="about.html" aria-current="page" aria-disabled="true" tabindex="-1">About</a>
  </nav>

</div>

</body>


</html>
